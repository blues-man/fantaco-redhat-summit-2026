{{/*
Platform Applications, in sync-wave order.

The waves encode QUICKSTART Section A's ordering, and the ordering is not
cosmetic: several of these steps fail confusingly rather than loudly when
run early. In particular the DataScienceCluster needs the RHOAI CRDs, and
the MaaS chain needs both the MaaS CRDs and Connectivity Link.
*/}}

{{- $wave := dict
  "clusterPrereqs" "-30"
  "rhoai"          "-20"
  "odfMcg"         "-20"
  "clawOperator"   "-15"
  "maas"           "-10"
  "observability"  "0"
  "mcpCatalog"     "20"
  "broker"         "20"
}}

{{- if .Values.components.clusterPrereqs.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-cluster-prereqs
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ get $wave "clusterPrereqs" }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ include "openclaw.repoURL" . }}
    targetRevision: {{ include "openclaw.revision" . }}
    path: {{ include "openclaw.basePath" . }}/components/cluster-prereqs
    helm:
      valuesObject:
        seats:
          count: {{ include "openclaw.seatCount" . }}
          namespacePrefix: {{ .Values.seats.namespacePrefix }}
          userPrefix: {{ .Values.seats.userPrefix }}
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}

{{- if .Values.components.rhoai.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-rhoai
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ get $wave "rhoai" }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ include "openclaw.repoURL" . }}
    targetRevision: {{ include "openclaw.revision" . }}
    path: {{ include "openclaw.basePath" . }}/components/rhoai
    helm:
      valuesObject:
        rhoai:
          channel: {{ .Values.components.rhoai.channel }}
          # Tick "RHOAI base" on the RHDP order form and the operator is
          # already installed; installing it twice is a conflict. The
          # DataScienceCluster is still applied either way, because the
          # generic base does not enable aigateway, mlflowoperator,
          # mcplifecycle, modelregistry, ogx or trustyai.
          installOperator: {{ not .Values.bases.rhoai }}
  destination:
    server: https://kubernetes.default.svc
    namespace: redhat-ods-operator
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The DSC is applied in the same Application as the Subscription that
      # creates its CRD. Retry until the CRD exists rather than failing.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
{{- end }}

{{- if .Values.components.odfMcg.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-odf-mcg
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ get $wave "odfMcg" }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ include "openclaw.repoURL" . }}
    targetRevision: {{ include "openclaw.revision" . }}
    path: {{ include "openclaw.basePath" . }}/components/odf-mcg
    helm:
      valuesObject:
        odf:
          channel: {{ .Values.components.odfMcg.channel }}
          storageClass: {{ .Values.storage.className }}
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-storage
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
{{- end }}

{{- if .Values.components.clawOperator.enabled }}
---
# claw-operator, in TWO Applications, because config/default does not
# include the CRDs: `#- ../crd` is commented out in its kustomization,
# and `make dev-deploy` applies them separately via `make install`.
# Pointing Argo at config/default alone deploys a running operator and
# no Claw CRD, so every seat fails with "resource mapping not found".
# Verified on sv68v 2026-11-19 — that is exactly what happened.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-claw-operator-crds
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ get $wave "clawOperator" }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.components.clawOperator.repoUrl }}
    targetRevision: {{ .Values.components.clawOperator.revision }}
    path: config/crd
  destination:
    server: https://kubernetes.default.svc
    namespace: claw-operator
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRDs exceed the annotation size limit for client-side apply.
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-claw-operator
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
  annotations:
    # After the CRDs.
    argocd.argoproj.io/sync-wave: "{{ add (get $wave "clawOperator" | int) 1 }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.components.clawOperator.repoUrl }}
    targetRevision: {{ .Values.components.clawOperator.revision }}
    path: {{ .Values.components.clawOperator.path }}
    kustomize:
      # Mirrors generate-deploy-overlay in the operator's Makefile.
      # The manifests ship placeholders -- image: controller:latest and
      # PROXY_IMAGE: claw-proxy:latest -- which are unpullable as-is.
      images:
        - {{ printf "controller=%s/claw-operator:%s" .Values.images.clawOperatorRegistry .Values.images.clawOperatorTag }}
      patches:
        # PROXY_IMAGE is an env var, not an image field, so the images
        # transformer above cannot reach it. Patch it the same way
        # `make dev-deploy` does.
        - target:
            kind: Deployment
          patch: |-
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: controller-manager
            spec:
              template:
                spec:
                  containers:
                  - name: manager
                    imagePullPolicy: Always
                    env:
                    - name: PROXY_IMAGE
                      value: {{ printf "%s/claw-proxy:%s" .Values.images.clawOperatorRegistry .Values.images.clawOperatorTag | quote }}
                    resources:
                      limits:
                        memory: 512Mi
                      requests:
                        memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: claw-operator
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}

{{- if and .Values.components.maas.enabled (eq (include "openclaw.maasEnabled" .) "true") }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-maas
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ get $wave "maas" }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ include "openclaw.repoURL" . }}
    targetRevision: {{ include "openclaw.revision" . }}
    path: {{ include "openclaw.basePath" . }}/components/maas
    helm:
      valuesObject:
        maas:
          upstreamApiKey: {{ include "openclaw.maasKey" . | quote }}
          upstreamEndpoint: {{ include "openclaw.maasUpstreamEndpoint" . }}
          model: {{ include "openclaw.maasModel" . }}
          tokenLimit: {{ .Values.maas.tokenLimit }}
          tokenWindow: {{ .Values.maas.tokenWindow }}
          tenantNamespace: {{ .Values.maas.tenantNamespace }}
          infraNamespace: {{ .Values.maas.infraNamespace }}
          gatewayNamespace: {{ .Values.maas.gatewayNamespace }}
          gatewayName: {{ .Values.maas.gatewayName }}
          gatewayHost: {{ include "openclaw.maasGatewayHost" . | quote }}
          gatewayClassName: {{ .Values.maas.gatewayClassName }}
          createGatewayClass: {{ .Values.maas.createGatewayClass }}
          tlsSecretName: {{ .Values.maas.tlsSecretName | quote }}
        seats:
          count: {{ include "openclaw.seatCount" . }}
          namespacePrefix: {{ .Values.seats.namespacePrefix }}
        storage:
          className: {{ .Values.storage.className }}
        deployer:
          guid: {{ include "openclaw.guid" . | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.maas.tenantNamespace }}
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 30
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 10m
{{- end }}

{{- if .Values.components.observability.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-observability
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ get $wave "observability" }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ include "openclaw.repoURL" . }}
    targetRevision: {{ include "openclaw.revision" . }}
    path: {{ include "openclaw.basePath" . }}/components/observability
    helm:
      valuesObject:
        observability:
          lokiStackSize: {{ .Values.components.observability.lokiStackSize }}
          retentionDays: {{ .Values.components.observability.retentionDays }}
          mlflowStandalone: {{ .Values.components.observability.mlflowStandalone }}
          mlflowRhoai: {{ .Values.components.observability.mlflowRhoai }}
        storage:
          className: {{ .Values.storage.className }}
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-logging
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
{{- end }}

{{- if .Values.components.observability.mlflowStandalone }}
---
# The standalone MLflow server itself, from upstream at a pinned commit.
#
# Not re-expressed as a local chart on purpose: deploy-traces-mlflow.sh
# pulls charts/mlflow out of the mlflow repo at SHA
# 336e57fc3f17183911b28deb51a18eb1a5316346 (chart 0.1.0, appVersion
# 3.12.0), and an Argo Application pointing at the same commit is the
# same artefact with the pin made visible. Its PostgreSQL comes from the
# observability chart, which is why that one syncs first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-mlflow
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.components.observability.mlflowChartRepo }}
    targetRevision: {{ .Values.components.observability.mlflowChartRevision }}
    path: charts
    helm:
      # A RAW VALUES STRING, NOT valuesObject, and the distinction is
      # load-bearing. The chart defaults to podSecurityContext.runAsUser
      # 1000 / fsGroup 1000, which restricted-v2 rejects outright:
      #   .containers[0].runAsUser: Invalid value: 1000: must be in the
      #   ranges: [1000840000, 1000849999]
      # The pod is never created and the Deployment sits at
      # ProgressDeadlineExceeded. deploy-traces-mlflow.sh nulls those two
      # keys in a values FILE, where Helm's coalesce deletes a key whose
      # value is null. Argo's valuesObject round-trips through JSON and
      # drops the nulls, so the chart defaults came back and the fix
      # silently did nothing. A raw string is passed through as -f.
      values: |
        image:
          repository: ghcr.io/mlflow/mlflow
          tag: "v{{ .Values.components.observability.mlflowVersion }}-full"
        replicaCount: 1
        server:
          value_options:
            host: "0.0.0.0"
            port: 5000
            workers: 2
            allowed_hosts: "*"
        mlflow:
          backendStoreUriFrom:
            secretKeyRef:
              name: mlflow-db-secret
              key: uri
          defaultArtifactRoot: "/mlflow/artifacts"
        storage:
          enabled: true
          size: 5Gi
          accessMode: ReadWriteOnce
          storageClassName: ""
        # null, not absent: OpenShift assigns the UID from the
        # namespace range and any pinned value is rejected.
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: null
          fsGroup: null
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        service:
          type: ClusterIP
        ingress:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}

{{- if .Values.components.mcpCatalog.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-mcp-catalog
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ get $wave "mcpCatalog" }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ include "openclaw.repoURL" . }}
    targetRevision: {{ include "openclaw.revision" . }}
    path: {{ include "openclaw.basePath" . }}/components/mcp-catalog
    helm:
      valuesObject:
        mcpCatalog:
          dashboardNamespace: {{ .Values.components.mcpCatalog.dashboardNamespace }}
          exemplarNamespace: {{ printf "%s%d" .Values.seats.namespacePrefix (int .Values.components.mcpCatalog.exemplarSeat) }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.components.mcpCatalog.dashboardNamespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}

{{- if .Values.components.seatIdentities.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-seat-identities
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
  annotations:
    # After the seats exist: it binds roles in their namespaces.
    argocd.argoproj.io/sync-wave: "16"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ include "openclaw.repoURL" . }}
    targetRevision: {{ include "openclaw.revision" . }}
    path: {{ include "openclaw.basePath" . }}/components/seat-identities
    helm:
      valuesObject:
        seats:
          count: {{ include "openclaw.seatCount" . }}
          namespacePrefix: {{ .Values.seats.namespacePrefix }}
          userPrefix: {{ .Values.seats.userPrefix }}
        identities:
          sharedPassword: {{ .Values.components.seatIdentities.sharedPassword | quote }}
        deployer:
          guid: {{ include "openclaw.guid" . | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-config
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}

{{- if .Values.components.broker.enabled }}
---
# Plain-manifest Application: the broker manifests already exist as YAML
# under broker-pg/openshift and are not worth re-expressing as a chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-broker
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "{{ get $wave "broker" }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ include "openclaw.repoURL" . }}
    targetRevision: {{ include "openclaw.revision" . }}
    path: clawoperator-openclaw/broker-pg/openshift
    directory:
      recurse: false
      include: "{cloudnativepg-operator.yaml,broker-db.yaml,broker.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: session-broker
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
{{- end }}
