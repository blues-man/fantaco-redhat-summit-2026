{{- if .Values.images.pullSecret }}
{{/*
Registry credentials for the seat.

Only rendered when images.pullSecret is set, which it is not by
default: the Hub images this chart points at pull anonymously. It
exists so a PRIVATE prefix works -- the quay.io/openclawopenshift repos
are private, which is why the chart cannot default to them even though
0f6584e made quay canonical for the scripts path.

Patched onto the default ServiceAccount rather than named on each
Deployment, because the FantaCo charts are shared with the scripts path
and this chart does not get to change their pod specs. Every pod in the
namespace that does not specify its own SA picks it up.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.images.pullSecretName }}
  namespace: {{ .Values.seat.namespace }}
  labels:
    demo.redhat.com/application: "openclaw-on-openshift"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.images.pullSecret | b64enc | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: {{ .Values.seat.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # The SA already exists and is controller-owned; adopt rather than
    # fight over the token secrets it accumulates.
    argocd.argoproj.io/compare-options: IgnoreExtraneous
imagePullSecrets:
  - name: {{ .Values.images.pullSecretName }}
{{- end }}
