{{/*
The seat.

WHAT BELONGS IN spec.config.raw AND WHY IT MATTERS HERE.

When a pod restarts, the operator re-seeds openclaw.json from the Claw CR,
wiping anything applied afterwards with `oc exec`. That is what
post-restart-repatch.sh exists to undo. Anything under spec.config.raw is
merged into operator.json BEFORE the operator's enrichment pipeline runs,
so it is re-applied on every pod start instead of being overwritten.

So everything 1-deploy-claw.sh and post-restart-repatch.sh currently poke
into openclaw.json with `oc exec ... node -e` is expressed below as CR
config instead. That is the single biggest win of the GitOps form: a pod
restart stops being an event that needs repairing.

The JSON paths below are the ones those scripts actually write — in
particular the token limits live under models.providers.openai, NOT under
agents.defaults.model, and credentials.secretRef is a LIST.
*/}}
{{- $modelKey := printf "openai/%s" .Values.maas.model }}
{{- $domain := .Values.maas.apiBase | trimPrefix "https://" | trimPrefix "http://" | splitList "/" | first }}
{{- if .Values.maas.key }}
---
# Only rendered when a key is passed explicitly. Normally it is not:
# per-seat sk-oai-... keys are minted by maas-mint-seat-keys.sh --apply
# AFTER the chain is Ready, so the secret is created out of band and this
# chart must not fight it. Managing it here would overwrite a live key on
# every resync.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.maas.keySecretName }}
  namespace: {{ .Values.seat.namespace }}
  labels:
    demo.redhat.com/application: "openclaw-on-openshift"
type: Opaque
stringData:
  api-key: {{ .Values.maas.key | quote }}
{{- end }}
---
apiVersion: claw.sandbox.redhat.com/v1alpha1
kind: Claw
metadata:
  name: instance
  namespace: {{ .Values.seat.namespace }}
  labels:
    demo.redhat.com/application: "openclaw-on-openshift"
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  image: {{ .Values.images.openclaw | quote }}
  # Token auth is the default — no spec.auth needed.
  credentials:
    - name: litellm
      type: bearer
      secretRef:
        - name: {{ .Values.maas.keySecretName }}
          key: api-key
      domain: {{ $domain | quote }}
  # THE MCP SERVERS. Without these the agent has no tools, which is the
  # entire demo -- and preflight reports it three different ways:
  # McpServersConfigured not set, "MCP customer: not configured", and
  # "Proxy allowlist missing mcp-customer-service" (the operator derives
  # the proxy allowlist from this block, so one omission fails all three).
  #
  # Service names, not routes: traffic stays in the namespace. The
  # servers speak streamable HTTP on /mcp -- a plain GET returns 406
  # because it wants the MCP Accept header, which means UP, not broken.
  mcpServers:
{{- range .Values.mcp.servers }}
    {{ .name }}:
      url: {{ printf "http://%s:%d/mcp" .service (int .port) | quote }}
      transport: streamable-http
{{- end }}
  customProviders:
    - name: openai
      baseUrl: {{ .Values.maas.apiBase | quote }}
      credentialRef: litellm
      api: openai-completions
      models:
        - name: {{ .Values.maas.model }}
          alias: {{ .Values.maas.model }}
  config:
    raw:
      gateway:
        controlUi:
          # Attendees reach the gateway through the audience Route, so
          # its origin must be listed or the browser connection is
          # refused with "Browser origin not allowed".
          #
          # It lives here rather than being patched in afterwards
          # because the operator RE-SEEDS gateway.controlUi.allowedOrigins
          # from its own template on every pod start. spec.config.raw is
          # merged BEFORE that enrichment, so this survives a restart --
          # which is what set-audience-origins.sh exists to repair when
          # it was patched the other way.
          allowedOrigins:
            - {{ printf "https://instance-%s.%s" .Values.seat.namespace .Values.cluster.appsDomain | quote }}
{{- if .Values.audience.enabled }}
            - {{ printf "https://%s" (include "seat.audienceHost" .) | quote }}
{{- end }}
      agents:
        defaults:
          model:
            primary: {{ $modelKey | quote }}
            fallbacks: []
          models:
            {{ $modelKey | quote }}:
              alias: {{ .Values.maas.model }}
          memorySearch:
            enabled: false
          workspace: {{ .Values.skills.workspace | quote }}
        # DECLARE `main`, OR THE SEEDED SKILLS ARE INVISIBLE TO THE UI.
        #
        # The gateway UI runs as agent `main`. The operator's seed
        # declares only `default`, and an UNDECLARED AGENT NEVER
        # RESOLVES THE WORKSPACE SKILLS DIRECTORY -- agents.defaults.
        # workspace is set correctly and simply does not apply to it:
        #   skills check --agent default -> Visible to model: 17
        #   skills check --agent main    -> Visible to model: 15
        #
        # The symptom reaches the attendee as a HALLUCINATION, not an
        # error: asked for /quote_builder the model answers that
        # /app/skills/quote-builder/SKILL.md is missing. That path has
        # never existed -- /app/skills holds the image's bundled
        # skills, workspace skills live under the workspace -- so the
        # model invents a plausible path for a skill it cannot see and
        # sends you looking in the wrong place.
        #
        # Asking the agent to list its skills is NOT a valid check: it
        # returns 15 and omits workspace skills even on a healthy seat.
        # Only `skills check --agent main` is reliable.
        #
        # WHY THIS BELONGS IN THE CR rather than in a repatch script.
        # agents.list is Tier 3 / user-only in the operator's own merge
        # model (ADR-0013): the operator never touches it, and
        # spec.config.raw lands in operator.json, which wins over PVC
        # state. So this is reapplied at every pod start by design --
        # where the scripts-side fix had to be re-run after each
        # re-seed, and would otherwise break mid-event at the next
        # audience reset.
        #
        # BOTH entries are listed deliberately. This array is replaced
        # wholesale, not appended to, so declaring only `main` would
        # drop `default`.
        list:
          - id: default
            name: "OpenClaw Assistant"
            workspace: {{ .Values.skills.workspace | quote }}
          - id: main
            name: "OpenClaw Assistant"
            workspace: {{ .Values.skills.workspace | quote }}
      models:
        providers:
          openai:
            contextWindow: {{ .Values.maas.contextWindow }}
            contextTokens: {{ .Values.maas.contextTokens }}
            maxTokens: {{ .Values.maas.maxTokens }}
            models:
              - id: {{ .Values.maas.model }}
                name: {{ .Values.maas.model }}
                api: openai-completions
                reasoning: false
                input: ["text"]
                contextWindow: {{ .Values.maas.contextWindow }}
                contextTokens: {{ .Values.maas.contextTokens }}
                maxTokens: {{ .Values.maas.maxTokens }}
                compat:
                  maxTokensField: max_tokens
                  supportsStore: false
                  supportsPromptCacheKey: false
                  supportsReasoningEffort: false
                  supportsDeveloperRole: false
      logging:
        consoleLevel: debug
{{- if .Values.tracing.enabled }}
      # ---- tracing into RHOAI MLflow -----------------------------------
      #
      # WHY BOTH diagnostics.otel AND env, WHICH LOOKS REDUNDANT. They
      # carry different halves. diagnostics.otel turns tracing ON and
      # says what to capture; the ENDPOINT is only ever read from the
      # OTEL_* environment. Set one without the other and you get
      # either a tracer with nowhere to send, or an endpoint nothing
      # emits to -- both silent.
      #
      # WHY env LIVES HERE AND NOT IN A PODSPEC. The operator owns the
      # gateway container's env list and STRIPS anything it did not put
      # there, so a Deployment-level env var survives until the next
      # reconcile. spec.config.raw is merged before that enrichment, so
      # this is the placement that survives a pod restart. That is the
      # lesson audience-reset.sh learned the hard way.
      diagnostics:
        enabled: true
        otel:
          enabled: true
          protocol: http/protobuf
          traces: true
          # Only traces. Metrics and logs have their own paths already,
          # and MLflow ingests neither.
          metrics: false
          logs: false
          sampleRate: {{ .Values.tracing.sampleRate }}
          captureContent:
            # NOT OPTIONAL, and not merely the parent of the flags
            # below: resolveContentCapturePolicy() bails out with
            # NO_MODEL_CONTENT_CAPTURE unless this is literally true,
            # and the per-field flags are only read once that gate
            # passes. Omit it and gen_ai spans still arrive -- with no
            # prompt or completion bodies.
            enabled: {{ .Values.tracing.captureContent }}
            inputMessages: {{ .Values.tracing.captureContent }}
            outputMessages: {{ .Values.tracing.captureContent }}
            toolInputs: {{ .Values.tracing.captureContent }}
            toolOutputs: {{ .Values.tracing.captureContent }}
            toolDefinitions: {{ .Values.tracing.captureContent }}
            systemPrompt: {{ .Values.tracing.captureSystemPrompt }}
      env:
        OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: {{ .Values.tracing.endpoint | quote }}
        OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "http/protobuf"
        # Without the semconv opt-in the gen_ai spans carry timings and
        # token counts but no message bodies -- the same symptom as a
        # missing captureContent, from the other end.
        OTEL_SEMCONV_STABILITY_OPT_IN: "gen_ai_latest_experimental"
        # Per-seat identity, so one MLflow experiment holding every
        # seat's traces can still be filtered down to one seat.
        OTEL_SERVICE_NAME: {{ printf "openclaw-%s" .Values.seat.namespace | quote }}
        OTEL_RESOURCE_ATTRIBUTES: {{ printf "openclaw.namespace=%s" .Values.seat.namespace | quote }}
{{- if .Values.tracing.headers }}
        # Normally empty: on the collector path the workspace and
        # experiment-id headers are the collector's, not the seat's.
        OTEL_EXPORTER_OTLP_TRACES_HEADERS: {{ .Values.tracing.headers | quote }}
{{- end }}
{{- end }}
