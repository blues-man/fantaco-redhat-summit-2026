{{- if .Values.maas.database.enabled }}
{{/*
Prerequisite 2 of 5: PostgreSQL and the maas-db-config secret.

PASSWORD HANDLING. ArgoCD renders with `helm template` and no cluster
access, so Helm's `lookup` returns nothing and `randAlphaNum` would mint a
NEW password on every single sync — rotating the credential out from under
a running database. So the password is either given explicitly, or derived
deterministically from the cluster GUID. Same GUID, same password, every
render; different cluster, different password.

If you prefer a real secret manager, set maas.database.password from it
(AgnosticV can inject it the same way it injects the upstream API key).
*/}}
{{- $pw := .Values.maas.database.password | default (printf "%s-maas-db-v1" (.Values.deployer.guid | default "openclaw")) | sha256sum | trunc 32 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maas-postgres-pvc
  namespace: {{ .Values.maas.infraNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storage.className }}
  resources:
    requests:
      storage: {{ .Values.maas.database.storage }}
---
apiVersion: v1
kind: Secret
metadata:
  name: maas-db-config
  namespace: {{ .Values.maas.infraNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
type: Opaque
stringData:
  # sslmode=disable: the stock postgresql image does not serve SSL.
  DB_CONNECTION_URL: "postgresql://{{ .Values.maas.database.user }}:{{ $pw }}@postgres.{{ .Values.maas.infraNamespace }}.svc.cluster.local:5432/{{ .Values.maas.database.name }}?sslmode=disable"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Values.maas.infraNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.maas.database.image }}
          env:
            - name: POSTGRESQL_USER
              value: {{ .Values.maas.database.user | quote }}
            - name: POSTGRESQL_PASSWORD
              value: {{ $pw | quote }}
            - name: POSTGRESQL_DATABASE
              value: {{ .Values.maas.database.name | quote }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maas-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.maas.infraNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
