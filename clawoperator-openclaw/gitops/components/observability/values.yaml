observability:
  lokiStackSize: "1x.extra-small"
  retentionDays: 3
  mlflowStandalone: true
  mlflowRhoai: true

  loki:
    enabled: true
    namespace: "openshift-logging"
    # stable-6.2 does NOT exist; the Subscription dies with
    # ResolutionFailed and, because Argo retries the whole operation,
    # every later resource in this chart stays Missing. On OCP 4.22 the
    # package offers stable-6.5/6.6/6.7, default 6.7. Verify before
    # changing OCP version:
    #   oc get packagemanifest loki-operator -n openshift-marketplace \
    #     -o jsonpath='{.status.defaultChannel}'
    channel: "stable-6.7"
    obcName: "loki-bucket"
    # Must match odf.obcStorageClassName in components/odf-mcg.
    obcStorageClass: "openclaw-mcg-pv"

  mlflow:
    # The standalone server: the OTLP trace backend for the whole demo.
    # Deployed from the upstream chart by a sibling Argo Application (see
    # the root chart) — only the PostgreSQL it needs lives here, because
    # the upstream chart does not ship one.
    namespace: "mlflow"
    pgImage: "image-registry.openshift-image-registry.svc:5000/openshift/postgresql:15-el9"
    pgUser: "mlflow"
    pgDatabase: "mlflow"
    pgStorage: "5Gi"
    # Deterministic, see the note in components/maas/templates/database.yaml
    # for why this is not randAlphaNum.
    pgPassword: ""

  rhoaiMlflow:
    # Backs Gen AI studio's "Save prompt" ONLY. It has no OTLP ingest at
    # all — /v1/traces and /otlp/v1/traces both 404 even authenticated —
    # so it does NOT replace the standalone server above. The two coexist
    # deliberately; do not "consolidate" them.
    dashboardNamespace: "redhat-ods-applications"
    dbStorage: "10Gi"
    artifactStorage: "20Gi"
    dbPassword: ""

storage:
  className: "gp3-csi"

deployer:
  guid: ""
