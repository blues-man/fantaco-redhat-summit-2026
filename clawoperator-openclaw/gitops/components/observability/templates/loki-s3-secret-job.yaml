{{- if .Values.observability.loki.enabled }}
{{- $ns := .Values.observability.loki.namespace }}
{{/*
The second genuinely imperative step, and for a structural reason.

An ObjectBucketClaim's credentials DO NOT EXIST until the claim binds:
NooBaa generates the access key pair into a Secret and the endpoint and
bucket name into a ConfigMap, both named after the OBC. The Loki Operator
wants those five values in one Secret of its own shape. Translating one
runtime-generated object into another is not something a template can do
— there is no value to template.

So: a PostSync hook that waits for Bound, reads both, and writes
logging-loki-s3. Idempotent, and safe to re-run.
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki-s3-secret
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loki-s3-secret
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "create", "patch", "update"]
  - apiGroups: ["objectbucket.io"]
    resources: ["objectbucketclaims"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loki-s3-secret
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loki-s3-secret
subjects:
  - kind: ServiceAccount
    name: loki-s3-secret
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-s3-secret
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: loki-s3-secret
      restartPolicy: OnFailure
      containers:
        - name: build-secret
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          env:
            - name: OBC
              value: {{ .Values.observability.loki.obcName | quote }}
            - name: NS
              value: {{ $ns | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              # Bound is the only honest check. A NooBaa CR reporting
              # Ready says nothing about whether a bucket can be claimed.
              for i in $(seq 1 120); do
                PHASE=$(oc get obc "$OBC" -n "$NS" -o jsonpath='{.status.phase}' 2>/dev/null || true)
                [[ "$PHASE" == "Bound" ]] && break
                echo "waiting for OBC $OBC to bind (phase=${PHASE:-none}, $i/120)"
                sleep 10
              done
              [[ "${PHASE:-}" == "Bound" ]] || { echo "ERROR: OBC never bound" >&2; exit 1; }

              AKI=$(oc get secret "$OBC" -n "$NS" -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)
              SAK=$(oc get secret "$OBC" -n "$NS" -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)
              BUCKET=$(oc get cm "$OBC" -n "$NS" -o jsonpath='{.data.BUCKET_NAME}')
              HOST=$(oc get cm "$OBC" -n "$NS" -o jsonpath='{.data.BUCKET_HOST}')
              PORT=$(oc get cm "$OBC" -n "$NS" -o jsonpath='{.data.BUCKET_PORT}')

              oc create secret generic logging-loki-s3 -n "$NS" \
                --from-literal=access_key_id="$AKI" \
                --from-literal=access_key_secret="$SAK" \
                --from-literal=bucketnames="$BUCKET" \
                --from-literal=endpoint="https://${HOST}:${PORT}" \
                --from-literal=region="" \
                --dry-run=client -o yaml | oc apply -f -

              echo "logging-loki-s3 written for bucket $BUCKET"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
{{- end }}
