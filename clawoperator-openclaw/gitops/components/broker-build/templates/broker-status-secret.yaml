{{- if .Values.build.createStatusKey }}
{{/*
The broker's status key, so the Deployment can start.

broker.yaml mounts BROKER_STATUS_KEY from secret session-broker-status
with Optional: false, so without this the pods sit in
CreateContainerConfigError -- which is what happened on s4p7f: the
image built, the database came up, the route was created, and the two
broker pods never started for want of one secret.

It is generated here rather than left to update-broker-ocp.sh because
a demo that needs a script run before its pods will start is not
deployed.

WHY A HOOK AND NOT A Secret RESOURCE, having tried the resource first.
`update-broker-ocp.sh --rotate-status-key` overwrites this value and
prints the new status URL -- the one that actually gets shared. A
templated Secret loses that race: the rotated value is a diff against
git, so selfHeal puts the derived one back, and the URL in the chat
window stops working with no event anywhere saying why. The first
attempt papered over this with compare-options: IgnoreExtraneous,
which does not apply -- "extraneous" means live-only resources, and
this one is in git. Even ignoreDifferences would not be enough: it
suppresses the diff, but any sync of this Application re-applies every
manifest in it, including this Secret.

Create-if-absent inside a hook has neither problem. Argo never owns
the value, so nothing reverts it; and the same logic means a resync
does not rotate the key under a running broker.

Derived from the GUID, like the other generated credentials, so a
rebuild of the same cluster lands on the same key.

NOT a security boundary. It only gates the broker's own status page,
which shows seat assignments. Treat the printed URL as semi-public and
rotate it between events.
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: broker-status-key
  namespace: {{ .Values.build.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: broker-status-key
  namespace: {{ .Values.build.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
rules:
  # get AND list. A get-only role makes the absence check fail in a way
  # that is indistinguishable from "the secret is not there", so the
  # hook would mint over a live key -- the exact bug it exists to
  # avoid. No update or patch: this hook must not be able to overwrite.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: broker-status-key
  namespace: {{ .Values.build.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: broker-status-key
subjects:
  - kind: ServiceAccount
    name: broker-status-key
    namespace: {{ .Values.build.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  # The checksum is in the NAME because Jobs are immutable: a changed
  # key or namespace has to be a different object, or Argo reuses the
  # Complete one and the change never runs. This cost a 30-seat run of
  # seat-identities once already.
  name: broker-status-key-{{ printf "%v|%v" .Values.build.namespace (.Values.build.statusKey | default .Values.deployer.guid) | sha256sum | trunc 8 }}
  namespace: {{ .Values.build.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: broker-status-key
      restartPolicy: Never
      containers:
        - name: status-key
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          env:
            - name: NS
              value: {{ .Values.build.namespace | quote }}
            - name: STATUS_KEY
              value: {{ .Values.build.statusKey | default (printf "%s-broker-status-v1" (.Values.deployer.guid | default "openclaw") | sha256sum | trunc 24) | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -uo pipefail

              if oc get secret session-broker-status -n "$NS" >/dev/null 2>&1; then
                echo "session-broker-status already exists — leaving it alone."
                echo "If it was rotated, that rotation is the live value;"
                echo "re-read it with:"
                echo "  oc get secret session-broker-status -n $NS -o jsonpath='{.data.status-key}' | base64 -d"
                exit 0
              fi

              if ! oc create secret generic session-broker-status -n "$NS" \
                    --from-literal=status-key="$STATUS_KEY" >/dev/null 2>&1; then
                # Lost a race with a concurrent create? Then it exists
                # now, and that is the outcome we wanted anyway.
                if oc get secret session-broker-status -n "$NS" >/dev/null 2>&1; then
                  echo "created concurrently; fine."
                  exit 0
                fi
                echo "ERROR: could not create session-broker-status in $NS." >&2
                echo "The broker pods will sit in CreateContainerConfigError" >&2
                echo "until this secret exists." >&2
                exit 1
              fi
              echo "created session-broker-status"
              echo "status URL path: /status?key=${STATUS_KEY}"
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {cpu: "1", memory: 512Mi}
{{- end }}
