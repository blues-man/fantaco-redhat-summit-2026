{{- if .Values.build.createStatusKey }}
{{/*
The broker's status key, so the Deployment can start.

broker.yaml mounts BROKER_STATUS_KEY from secret session-broker-status
with Optional: false, so without this the pods sit in
CreateContainerConfigError -- which is what happened on s4p7f: the
image built, the database came up, the route was created, and the two
broker pods never started for want of one secret.

It is generated here rather than left to update-broker-ocp.sh because
a demo that needs a script run before its pods will start is not
deployed. The script still works and still rotates it:
`update-broker-ocp.sh --rotate-status-key` overwrites this value and
prints the new status URL, which is the authoritative one to share.

Derived from the GUID, like the other generated credentials, so it is
stable across syncs rather than rotating under a running broker on
every reconcile.

NOT a security boundary. It only gates the broker's own status page,
which shows seat assignments. Treat the printed URL as semi-public and
rotate it between events.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: session-broker-status
  namespace: {{ .Values.build.namespace }}
  labels:
    demo.redhat.com/application: "openclaw-on-openshift"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # update-broker-ocp.sh --rotate-status-key is expected to overwrite
    # this. Without this option a resync would put the derived value
    # back and silently invalidate the status URL you just shared.
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  status-key: {{ .Values.build.statusKey | default (printf "%s-broker-status-v1" (.Values.deployer.guid | default "openclaw") | sha256sum | trunc 24) | quote }}
{{- end }}
