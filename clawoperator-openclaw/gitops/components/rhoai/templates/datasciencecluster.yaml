---
# RHOAI DataScienceCluster for MaaS-over-MaaS + MLflow.
#
# Every Managed component below is load-bearing, and three of them are not
# obvious. Read the comments before trimming: this cluster also runs the
# seats (11 pods each), so nothing is Managed for the sake of it.
#
# TRAPS, all paid for in real time:
#   - aigateway.modelsAsAService, NOT kserve.modelsAsService. The latter is
#     deprecated and, once set to Removed, CANNOT be re-enabled. One-way door.
#   - Enabling aigateway is not sufficient. MaaS also needs a Gateway,
#     PostgreSQL + maas-db-config, namespace labels and Connectivity Link —
#     that is the components/maas chart, not this one.
#   - Dashboard feature flags (genAiStudio, mlflow, guardrails, mcpCatalog)
#     default to false in OdhDashboardConfig AND the dashboard caches the
#     CR. After changing them: oc rollout restart deploy/rhods-dashboard.
apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: {{ .Values.rhoai.dscName }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    # The CRD arrives with the Subscription above, in the same sync.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    demo.redhat.com/application: "openclaw-on-openshift"
spec:
  components:
    dashboard:
      managementState: Managed
    kserve:
      managementState: Managed
    aigateway:
      managementState: Managed
      modelsAsAService:
        managementState: Managed
    mlflowoperator:
      managementState: Managed
    # Required for the MCP CRDs and the mcp-gateway controller.
    mcplifecycleoperator:
      managementState: Managed
    # NOT for the registry itself. The dashboard gates BOTH
    # "AI hub -> MCP servers" and "AI hub -> Catalog" on
    # requiredComponents: [MODEL_REGISTRY], on top of their own feature
    # flags. With this Removed, those pages stay hidden even with
    # mcpCatalog and mcpRegistry set to true. Cost an hour on rosa-tztnl.
    modelregistry:
      managementState: Managed
    # Required by the Gen AI studio Playground nav item.
    ogx:
      managementState: Managed
    # Also required by the Playground, and far less obvious: the send path
    # probes for NemoGuardrails CRs. With trustyai Removed the API group
    # trustyai.opendatahub.io/v1alpha1 does not exist, discovery fails, and
    # the BFF turns that into HTTP 500 on EVERY prompt. The dashboard's own
    # `guardrails: false` flag does not prevent the probe.
    trustyai:
      managementState: Managed
    aipipelines:
      managementState: Removed
    feastoperator:
      managementState: Removed
    llamastackoperator:
      managementState: Removed
    ray:
      managementState: Removed
    sparkoperator:
      managementState: Removed
    trainer:
      managementState: Removed
    trainingoperator:
      managementState: Removed
    workbenches:
      managementState: Removed
